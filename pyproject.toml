[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ogv01-business"
version = "0.2.0"
description = "Observation, meta-learning, SDL confirmation and architecture production"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "scipy>=1.13,<2",
  "pydantic>=2.10,<3", "pydantic-settings>=2,<3", "httpx>=0.28,<1",
  "python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jsonschema>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pyyaml>=6,<7"]
documents = ["docling>=2,<3"]

[project.scripts]
ogflow = "ogflow.cli:main"

[tool.setuptools.packages.find]
include = ["ogflow*"]

[tool.pytest.ini_options]
testpaths = ["tests/business"]


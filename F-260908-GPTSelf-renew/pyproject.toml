[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-self-renew"
version = "0.1.0"
description = "Evidence-led multi-agent code discovery, requirements, development and review"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
self-renew = "renew.cli:main"

[tool.setuptools.packages.find]
include = ["renew*"]

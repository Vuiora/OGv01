[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plda"
version = "0.1.0"
description = "Conservative parallel feasibility analysis and heterogeneous task scheduling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cpu = ["numpy>=1.26"]
npu = ["openvino>=2025.0", "numpy>=1.26"]

[project.scripts]
plda = "plda.__main__:main"

[tool.setuptools.packages.find]
include = ["plda*"]

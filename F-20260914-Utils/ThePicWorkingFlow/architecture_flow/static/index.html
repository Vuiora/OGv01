<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>架构工作台 · Architecture Flow</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui;color:#18312e;background:#f1f5f3}*{box-sizing:border-box}body{margin:0}header{padding:28px 6%;background:#123d35;color:white}header small{color:#aed3c6}main{max-width:1250px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:460px 1fr;gap:24px}.panel{background:white;border:1px solid #d8e3dc;border-radius:12px;padding:26px}h1{font-size:26px;margin:8px 0}h2{font-size:19px;margin:0 0 22px}label{display:block;font-size:14px;font-weight:600;margin:16px 0 7px}input,textarea,select{font:inherit;width:100%;padding:11px;border:1px solid #bbcfc4;border-radius:6px}textarea{resize:vertical;min-height:95px}button{background:#166b51;color:white;border:0;padding:12px 18px;border-radius:6px;font:inherit;cursor:pointer;margin:16px 8px 0 0}button:disabled{opacity:.5}.muted{font-size:13px;color:#637b72;line-height:1.7}.stage{padding:13px 15px;margin:8px 0;border-left:4px solid #d4e1db;background:#f7faf8}.active{border-color:#008a00;background:#e5f2eb}.error{color:#a12020}pre{font:13px/1.7 monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto}.downloads{display:flex;flex-wrap:wrap}a{color:#166b51}@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
<header><small>n8n × Docling × LLM API</small><h1>架构工作台</h1><div>从代码与文档，到遵循项目风格的模块图</div></header>
<main><section class="panel"><h2>创建架构任务</h2><p class="muted">总图展示所有一级模块，每个一级模块独立成页。访问密钥由本机服务自动填写，仅保留在当前页面内存中。</p>
<form id="form"><label for="key">工作台访问密钥（APP_API_KEY）</label><input id="key" type="password" autocomplete="off" required>
<label for="repo">代码目录（支持绝对路径）</label><input id="repo" value="C:\Users\Lenovo\Desktop\OGv01\F-20260914-Utils\ParallelLogicDeterminationAlgorithModule" required>
<label for="docs">文档路径（可选；每行一个）</label><textarea id="docs" placeholder="可留空。填写 PDF、Word、Markdown 等文档的绝对路径，或相对 INPUT_ROOT 的路径。系统会先交给 Docling 转成 Markdown 再分析。"></textarea>
<label for="modules">一级模块（可选；每行一个）</label><textarea id="modules" placeholder="留空时，根据实际代码自动划分模块。也可填写希望采用的模块名称。"></textarea>
<label for="instructions">设计原则（固定，内容按代码生成）</label><textarea id="instructions" readonly rows="10">分析代码职责与数据流。遵循 C:\Users\Lenovo\Desktop\OGv01\F-20260914-Utils\TheStructure.drawio 所体现的架构表达思路、层次组织、配色、连线语义、页面布局和可读性原则。根据待分析代码和文档确定模块名称、数量、边界、组件与连接；总图展示全局关系，各一级模块独立成页，子区域体现内部职责。模板仅供设计参考，不要求复制或保留其原有页面、模块、节点、文字或业务内容。区分已有实现、外部系统和提议设计。</textarea>
<label for="mode">编排方式</label><select id="mode"><option value="n8n">n8n 工作流</option><option value="direct">API 直接执行（开发验证）</option></select>
<button id="submit">创建并运行</button></form><p class="muted">模型地址和厂商 API Key 在服务端 .env 配置。代码目录和文档路径支持绝对地址；文档不是必填项。</p></section>
<section class="panel"><h2>流程与结果</h2><div id="stages"></div><p id="status" class="muted">等待创建任务</p><button id="cancel" hidden>取消任务</button><div id="downloads" class="downloads"></div><pre id="detail"></pre></section></main>
<script>
const stages=[['ingest','01 代码采集 / Docling 文档解析'],['analyze','02 大模型代码架构分析'],['design','03 大模型模块与数据流设计'],['render','04 项目样式应用 / 总图与分页'],['check','05 模块归属与风格检查'],['publish','06 校验通过，发布 draw.io']];
const $=id=>document.getElementById(id);for(const [id,label] of stages){const d=document.createElement('div');d.id='s-'+id;d.className='stage';d.textContent=label;$('stages').append(d)}
const offlineMessage='无法连接本地后台服务。请运行 ThePicWorkingFlow/scripts/start-local.ps1，等待服务就绪后重试；通常不是 API Key 错误。';
let job=null,timer=null;async function api(path,method='GET',body){let r;try{r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-API-Key':$('key').value},body:body?JSON.stringify(body):undefined})}catch(e){throw Error(offlineMessage)}let data;try{data=await r.json()}catch(e){throw Error('后台返回了无效响应（HTTP '+r.status+'），请检查服务日志。')}if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
const split=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
async function loadConfig(){try{const r=await fetch('/v1/client-config');if(!r.ok)throw Error();const c=await r.json();$('key').value=c.api_key||'';$('repo').value=c.default_repository;$('modules').value=c.module_names.join('\n');$('instructions').value=c.instructions}catch(e){$('detail').textContent='无法自动读取本机配置，请确认服务已启动后刷新页面。'}}
async function poll(){try{const s=await api('/v1/jobs/'+job);$('status').textContent=`${s.job_id} · ${s.state} · 修订 ${s.revision}`;for(const [id] of stages)$('s-'+id).classList.toggle('active',s.running_stage===id);$('detail').textContent=s.error||JSON.stringify(s.events,null,2);if(['SUCCEEDED','FAILED','CANCELLED','REJECTED'].includes(s.state)){clearInterval(timer);$('submit').disabled=false;$('cancel').hidden=true;if(s.artifacts)for(const [name,path] of Object.entries(s.artifacts)){if(name==='sha256')continue;const b=document.createElement('button');b.textContent='下载 '+name;b.onclick=async()=>{try{const r=await fetch(path,{headers:{'X-API-Key':$('key').value}});if(!r.ok)throw Error('下载失败');const u=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=u;a.download=path.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){$('detail').textContent=e.message}};$('downloads').append(b)}}}catch(e){clearInterval(timer);$('detail').textContent=e.message;$('submit').disabled=false}}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('downloads').replaceChildren();$('detail').textContent='';clearInterval(timer);try{const body={repository:$('repo').value,documents:split('docs'),module_names:split('modules'),instructions:$('instructions').value,preserve_page_ids:[]};const r=await api($('mode').value==='n8n'?'/v1/launch':'/v1/jobs?run=true','POST',body);job=r.job_id;if(!job)throw Error('n8n 未返回 job_id，请检查工作流响应节点');$('cancel').hidden=false;timer=setInterval(poll,1500);await poll()}catch(e){$('detail').textContent=e.message;$('submit').disabled=false}};
$('cancel').onclick=async()=>{try{await api('/v1/jobs/'+job+'/cancel','POST');await poll()}catch(e){$('detail').textContent=e.message}};
loadConfig();
</script></html>

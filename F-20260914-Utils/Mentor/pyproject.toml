[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mentor-workflows"
version = "0.1.0"
description = "Evidence-based document workflows designed by Teacher models and executed by Students"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "pyyaml>=6,<7", "jsonschema>=4.23,<5",
  "pypdf>=5,<7", "pillow>=11,<13", "python-multipart>=0.0.20,<1",
  "typer>=0.15,<1", "opentelemetry-api>=1.30,<2"
]

[project.optional-dependencies]
documents = ["docling>=2.50,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-jsonschema"]

[project.scripts]
mentor = "mentor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL", "n8n: requires a live n8n instance", "live: requires model credentials and explicit budget"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true


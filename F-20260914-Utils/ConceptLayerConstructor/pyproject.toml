[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-layer-constructor"
version = "0.1.0"
description = "Docling + LLM hierarchical knowledge documents, orchestrated by n8n"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3",
  "python-docx>=1.1,<2", "reportlab>=4.3,<5", "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
docling = ["docling>=2.48,<3"]
dev = ["pytest>=8,<10", "pypdf>=5,<7", "ruff>=0.11,<1"]

[project.scripts]
clc-worker = "clc.worker:main"

[tool.setuptools.packages.find]
include = ["clc*"]

[tool.setuptools.package-data]
clc = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

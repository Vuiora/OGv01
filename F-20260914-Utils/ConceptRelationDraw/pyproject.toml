[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-relation-draw"
version = "0.1.0"
description = "Document-grounded concept graphs with n8n and Docling"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
include = ["concept_relation*"]

[tool.setuptools.package-data]
concept_relation = ["static/*", "fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
